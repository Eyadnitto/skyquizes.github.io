<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sky Quizes</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f5f0e7;
      color: #7d3517;
      font-family: Arial, Tahoma, sans-serif;
    }

    .page {
      width: 100%;
      max-width: 1000px;
      margin: auto;
      padding: 25px 20px 50px;
      text-align: center;
    }

    .logo {
      direction: ltr;
      margin-bottom: 35px;
      color: #883b1b;
      font-family: Georgia, serif;
      font-size: clamp(48px, 9vw, 90px);
      font-weight: bold;
      line-height: 0.9;
      letter-spacing: 3px;
      text-shadow:
        4px 4px 0 #f5f0e7,
        6px 6px 0 #883b1b;
    }

    .arabic-title {
      max-width: 800px;
      margin: 0 auto 15px;
      color: #111;
      font-family: Tahoma, Arial, sans-serif;
      font-size: clamp(34px, 6vw, 65px);
      font-weight: bold;
      line-height: 1.4;
    }

    .description {
      margin: 10px auto 35px;
      color: #222;
      font-size: clamp(17px, 2.5vw, 24px);
      line-height: 1.8;
    }

    .quiz-section {
      max-width: 850px;
      margin: 35px auto;
    }

    .quiz-section h2 {
      margin-bottom: 25px;
      color: #713015;
      font-size: 28px;
    }

    /*
      Two buttons on every line.
      The complete button is clickable.
    */
    .quiz-buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .quiz-button {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 70px;
      padding: 18px 12px;
      border-radius: 12px;
      background: #a9542c;
      color: white;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .quiz-button:hover {
      background: #713015;
      transform: translateY(-3px);
    }

    .quiz-button:active {
      transform: translateY(0);
    }

    /*
      Mobile design:
      Keeps two buttons on every line.
    */
    @media (max-width: 600px) {
      .page {
        padding: 20px 12px 40px;
      }

      .logo {
        margin-bottom: 25px;
      }

      .quiz-buttons {
        gap: 10px;
      }

      .quiz-button {
        min-height: 60px;
        padding: 12px 6px;
        font-size: 15px;
      }

      .quiz-section h2 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="logo">
      SKY<br>
      QUIZES
    </div>

    <h1 class="arabic-title">
      مراجعة على السريع
    </h1>

    <p class="description">
      تم إنشاء الموقع لمراجعة كويزات التليجرام<br>
      بسهولة تامة
    </p>

    <section class="quiz-section">
      <h2>اختر الاختبار</h2>

      <div class="quiz-buttons">

        <a
          class="quiz-button"
          href="https://t.me/QuizBot?start=8jKpDOw6"
          target="_blank"
          rel="noopener"
        >
          جدول الضرب
        </a>

        <a
          class="quiz-button"
          href="https://t.me/QuizBot?start=o5vjXYOh"
          target="_blank"
          rel="noopener"
        >
          المحاضرة ٣
        </a>

        <a
          class="quiz-button"
          href="https://t.me/QuizBot?start=eEQePWQc"
          target="_blank"
          rel="noopener"
        >
          المحاضرة ٤
        </a>

        <a
          class="quiz-button"
          href="https://t.me/QuizBot?start=M8jwScy0"
          target="_blank"
          rel="noopener"
        >
          المحاضرة ٥
        </a>

        <a
          class="quiz-button"
          href="https://t.me/QuizBot?start=NgOEBg6p"
          target="_blank"
          rel="noopener"
        >
          المحاضرة ٦
        </a>

        <a
          class="quiz-button"
          href="https://t.me/QuizBot?start=hve4X2pH"
          target="_blank"
          rel="noopener"
        >
          المحاضرة ٧
        </a>
        <a
          class="quiz-button"
          href="t.me/QuizBot?start=KRh8F0yW"
          target="_blank"
          rel="noopener"
        >
          المحاضرة ٨
        </a>

      </div>
    </section>

  </main>

</body>

</html>
